<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>reel render</title>
<style>
@font-face { font-family: 'Black Han Sans'; src: url('fonts/BlackHanSans-Regular.ttf'); }
@font-face { font-family: 'Noto Sans KR'; src: url('fonts/NotoSansKR-VF.ttf'); font-weight: 100 900; }
body { margin: 0; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { drawFrame } from './src/scene.js';
import { SLOT, HANDLE } from './src/brand.js';
const cv = document.getElementById('c'); const x = cv.getContext('2d');
const load = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
let S = null;
// data = { plan, track: { lines:[{ text, sec, rms }] } }
window.setup = async (data) => {
  const emblem = await load('src/emblem.png');
  // 설계도에 나오는 글자를 모두 미리 불러 둔다 (첫 프레임부터 같은 글꼴)
  const text = JSON.stringify(data.plan) + data.track.lines.map((l) => l.text).join('')
    + Object.values(SLOT).map((s) => s.label).join('') + HANDLE + '황금나침반AI캐릭터목소리0123456789%→↑↓·…';
  await Promise.all(['400 100px "Black Han Sans"', '900 60px "Noto Sans KR"', '800 40px "Noto Sans KR"', '700 40px "Noto Sans KR"', '500 40px "Noto Sans KR"'].map((f) => document.fonts.load(f, text)));
  await document.fonts.ready;
  S = { plan: data.plan, track: data.track, assets: { emblem } };
  return { emblem: !!emblem };
};
// 여러 프레임을 한 번에 그려 JPEG로 돌려줌 (왕복 줄이기)
window.frames = (ts, q = 0.92) => ts.map((t) => { drawFrame(x, S.plan, S.track, t, S.assets); return cv.toDataURL('image/jpeg', q); });
window.ready = true;
</script></body></html>
