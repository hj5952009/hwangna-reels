# 손으로 실행: 이 Gemini 키로 쓸 수 있는 모델 이름만 보여 줌 (요청 몫을 쓰지 않는 목록 조회, 키는 로그에 안 찍힘)
name: models
on: workflow_dispatch
permissions: { contents: read }
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: 모델 목록
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }
        run: |
          curl -s -H "x-goog-api-key: $GEMINI_API_KEY" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000" \
            | jq -r '.models[] | select(.supportedGenerationMethods | index("generateContent")) | .name' | sort
