# 캐릭터 목소리 오디션 (손으로만 실행) — 시험 대사 두 줄만 읽는다(발표 자료 원문은 넣지 않음). 결과 mp3는 3일 뒤 사라짐
name: voice-audition
on:
  workflow_dispatch:
    inputs:
      pick:
        description: '목소리:말투 후보 (예: Iapetus:C,Leda:C). 비우면 기본 9개'
        required: false
        default: ''
      lines:
        description: '시험 대사 (JSON 문자열 배열). 비우면 기본 대사'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund > /dev/null
      - name: 목소리 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUDITION_PICK: ${{ inputs.pick }}
          AUDITION_LINES: ${{ inputs.lines }}
        run: node dev/voice-audition.mjs audition
      - uses: actions/upload-artifact@v4
        with:
          name: voice-audition
          path: audition/*.mp3
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: voice-audition-list
          path: audition/list.json
          retention-days: 3
