<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>장면 프레임</title>
<style>
@font-face { font-family: 'Black Han Sans'; src: url('../fonts/BlackHanSans-Regular.ttf'); }
@font-face { font-family: 'Noto Sans KR'; src: url('../fonts/NotoSansKR-VF.ttf'); font-weight: 100 900; }
body { margin: 0; background: #222; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { drawFrame, timeline, captionProblems } from '../src/scene.js';
const cv = document.getElementById('c'); const x = cv.getContext('2d');
const load = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
const planUrl = new URLSearchParams(location.search).get('plan') || '../test/fixtures/plan.json';
const plan = await (await fetch(planUrl)).json();
// 가짜 목소리: 대사 7.5자/초, 입은 사인파
const track = { lines: plan.scenes.map((s) => { const sec = Math.max(2.2, s.say.length / 7.5); return { text: s.say, sec, rms: Array.from({ length: Math.ceil(sec * 30) }, (_, k) => Math.abs(Math.sin(k * 0.9)) * 0.6) }; }) };
const tl = timeline(track);
const assets = { emblem: await load('../src/emblem.png') };
await Promise.all(['400 100px "Black Han Sans"', '900 60px "Noto Sans KR"', '800 40px "Noto Sans KR"', '700 40px "Noto Sans KR"'].map((f) => document.fonts.load(f, JSON.stringify(plan) + 'AI캐릭터목소리황금나침반')));
window.info = { tl, kinds: plan.scenes.map((s) => s.kind) };
window.draw = (t) => { drawFrame(x, plan, track, t, assets); };
window.safeCheck = () => captionProblems(x, plan);
window.ready = true;
</script></body></html>
